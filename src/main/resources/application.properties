# ==============================
# MONGODB
# ==============================
spring.data.mongodb.uri=mongodb://localhost:27017/africevent
spring.data.mongodb.auto-index-creation=true
server.port=8080

# ==============================
# FICHIERS
# ==============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads/
app.upload.allowed-extensions=jpg,png,webp
app.base-url=http://localhost:8080

# ==============================
# CORS (origines separees par des virgules)
# ==============================
app.cors.allowed-origins=http://localhost:4200

# ==============================
# JWT
# Le secret est fourni par la variable d'environnement APP_JWT_SECRET
# ==============================
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration=86400000

# ==============================
# COMMANDES
# La duree d'expiration est aussi celle de la session de paiement SmartPay
# (bornee entre 5 et 1440 minutes par SmartPay)
# ==============================
app.order.expiration-minutes=30
app.order.expiration-check-ms=60000
app.order.max-quantity=10

# ==============================
# QR CODE
# ==============================
app.qr.size=300

# ==============================
# MOYENS DE PAIEMENT PROPOSES AU CLIENT
# Cle = code SmartPay, valeur = libelle affiche. Ces moyens doivent etre
# actives sur votre compte marchand SmartPay.
# ==============================
app.payment.methods[SMARTPAY]=Compte SmartPay
app.payment.methods[COLLECT_MTN]=MTN Mobile Money
app.payment.methods[COLLECT_ORANGE]=Orange Money

# ==============================
# SMARTPAY CHECKOUT
# Les secrets sont fournis par variables d'environnement
# ==============================
smartpay.base-url=${SMARTPAY_BASE_URL:https://proxy-africx-test.afric.group/checkout}
smartpay.key-id=${SMARTPAY_KEY_ID:}                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         
smartpay.api-secret=${SMARTPAY_API_SECRET:}
smartpay.webhook-secret=${SMARTPAY_WEBHOOK_SECRET:}
smartpay.currency=XAF
smartpay.locale=fr
smartpay.return-url=
smartpay.cancel-url=
smartpay.connect-timeout-ms=5000
smartpay.read-timeout-ms=30000
smartpay.webhook-tolerance-seconds=300

# ==============================
# SEEDER ADMIN
# Utilise au premier demarrage uniquement. Si un utilisateur avec cet email
# existe deja, rien n'est cree. Le mot de passe vient de APP_ADMIN_PASSWORD.
# ==============================
app.admin.email=tchaakofreedy8@gmail.com
app.admin.password=Admin@1234
app.admin.nom=Administrateur
app.admin.telephone=+237600000000


app.frontend.base-url=http://localhost:4200
app.mail.brand=Afric Event
app.otp.length=6
app.otp.expiration-minutes=10
app.otp.resend-seconds=60
app.otp.max-attempts=5